<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Coloring Randomizer</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff4fa;
  color: #3b2632;
}

.container {
  width: 92%;
  max-width: 650px;
  margin: 30px auto;
}

h1 {
  text-align: center;
  color: #b83280;
  margin-bottom: 5px;
}

.subtitle {
  text-align: center;
  color: #725565;
  margin-top: 0;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 20px;
  margin: 18px 0;
  box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

.result {
  text-align: center;
  padding: 25px 15px;
}

.result-label {
  font-size: 14px;
  color: #806777;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.book-result {
  font-size: 29px;
  font-weight: bold;
  color: #b83280;
  margin: 12px 0 4px;
}

.page-result {
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 16px;
}

button {
  border: none;
  border-radius: 12px;
  padding: 13px 16px;
  margin: 5px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.primary {
  background: #b83280;
  color: white;
}

.secondary {
  background: #e8d2df;
  color: #563747;
}

.complete {
  background: #629b67;
  color: white;
}

.danger {
  background: #b54141;
  color: white;
}

.buttons {
  text-align: center;
}

input {
  width: 100%;
  padding: 12px;
  margin: 5px 0 10px;
  border: 1px solid #d4c3cc;
  border-radius: 10px;
  font-size: 16px;
}

label {
  font-weight: bold;
  display: block;
  margin-top: 8px;
}

.book {
  border-top: 1px solid #eadde4;
  padding: 13px 0;
}

.book:first-child {
  border-top: none;
}

.book-title {
  font-weight: bold;
  font-size: 18px;
  color: #8f2865;
}

.stats {
  font-size: 14px;
  color: #725565;
  margin-top: 4px;
}

.completed-pages {
  margin-top: 8px;
  line-height: 1.8;
}

.page-chip {
  display: inline-block;
  background: #f1e2eb;
  border-radius: 8px;
  padding: 4px 8px;
  margin: 2px;
  font-size: 13px;
}

.restore {
  cursor: pointer;
  color: #a0296e;
  font-weight: bold;
  margin-left: 3px;
}

.small-note {
  font-size: 13px;
  color: #806777;
}

details summary {
  cursor: pointer;
  font-weight: bold;
  color: #8f2865;
  font-size: 18px;
}

.progress {
  width: 100%;
  height: 9px;
  background: #eee3e9;
  border-radius: 20px;
  overflow: hidden;
  margin-top: 8px;
}

.progress-bar {
  height: 100%;
  background: #b83280;
}

.footer {
  text-align: center;
  color: #8c7481;
  font-size: 12px;
  margin: 25px 0;
}
</style>
</head>

<body>

<div class="container">

<h1>🎨 My Coloring Randomizer</h1>
<p class="subtitle">What should I color next?</p>

<div class="card result">
  <div class="result-label">Your next picture</div>

  <div id="bookResult" class="book-result">
    Ready to choose!
  </div>

  <div id="pageResult" class="page-result"></div>

  <div class="buttons">
    <button class="primary" onclick="randomize()">
      🎲 Randomize
    </button>

    <button id="completeButton"
            class="complete"
            onclick="markComplete()"
            style="display:none;">
      ✓ Mark Completed
    </button>
  </div>
</div>

<div class="card">
  <h2>📚 My Books</h2>
  <div id="bookList"></div>
</div>

<div class="card">

<details>
<summary>➕ Add Another Book</summary>

<br>

<label>Book name</label>
<input id="newBookName"
       type="text"
       placeholder="Example: Disney Animals">

<label>Number of pages</label>
<input id="newBookPages"
       type="number"
       min="1"
       value="100">

<button class="primary" onclick="addBook()">
  Add Book
</button>

</details>

</div>

<div class="card">

<details>
<summary>⚙️ Options</summary>

<p class="small-note">
Your completed pages and added books are saved on this device
in this browser.
</p>

<button class="danger" onclick="resetEverything()">
  Reset All Data
</button>

</details>

</div>

<div class="footer">
Made for coloring one mystery page at a time 💗
</div>

</div>

<script>

const DEFAULT_BOOKS = [
  {name:"Babies", pages:100, completed:[]},
  {name:"Princesses", pages:100, completed:[]},
  {name:"Villains", pages:100, completed:[]},
  {name:"Family", pages:100, completed:[]},
  {name:"The Classics", pages:100, completed:[]},
  {name:"Pixar", pages:100, completed:[]}
];

let books = loadBooks();

let currentBook = null;
let currentPage = null;

function loadBooks() {

  const saved = localStorage.getItem("coloringRandomizerBooks");

  if (saved) {
    try {
      return JSON.parse(saved);
    } catch(e) {}
  }

  return JSON.parse(JSON.stringify(DEFAULT_BOOKS));
}

function saveBooks() {
  localStorage.setItem(
    "coloringRandomizerBooks",
    JSON.stringify(books)
  );
}

function randomize() {

  let available = [];

  books.forEach((book, bookIndex) => {

    for (let page = 1; page <= book.pages; page++) {

      if (!book.completed.includes(page)) {
        available.push({
          bookIndex: bookIndex,
          page: page
        });
      }

    }

  });

  if (available.length === 0) {

    document.getElementById("bookResult").textContent =
      "You colored everything! 🎉";

    document.getElementById("pageResult").textContent = "";

    document.getElementById("completeButton").style.display =
      "none";

    return;
  }

  const choice =
    available[Math.floor(Math.random() * available.length)];

  currentBook = choice.bookIndex;
  currentPage = choice.page;

  document.getElementById("bookResult").textContent =
    books[currentBook].name;

  document.getElementById("pageResult").textContent =
    "Page " + currentPage;

  document.getElementById("completeButton").style.display =
    "inline-block";
}

function markComplete() {

  if (currentBook === null || currentPage === null) return;

  if (!books[currentBook].completed.includes(currentPage)) {
    books[currentBook].completed.push(currentPage);
    books[currentBook].completed.sort((a,b) => a-b);
  }

  saveBooks();
  renderBooks();

  document.getElementById("bookResult").textContent =
    "Completed! 🎉";

  document.getElementById("pageResult").textContent =
    books[currentBook].name + " — Page " + currentPage;

  document.getElementById("completeButton").style.display =
    "none";

  currentBook = null;
  currentPage = null;
}

function restorePage(bookIndex, page) {

  books[bookIndex].completed =
    books[bookIndex].completed.filter(p => p !== page);

  saveBooks();
  renderBooks();
}

function addBook() {

  const name =
    document.getElementById("newBookName").value.trim();

  const pages =
    parseInt(document.getElementById("newBookPages").value);

  if (!name) {
    alert("Please enter a book name.");
    return;
  }

  if (!pages || pages < 1) {
    alert("Please enter the number of pages.");
    return;
  }

  books.push({
    name:name,
    pages:pages,
    completed:[]
  });

  saveBooks();
  renderBooks();

  document.getElementById("newBookName").value = "";
  document.getElementById("newBookPages").value = "100";

  alert(name + " was added!");
}

function renderBooks() {

  const container = document.getElementById("bookList");

  container.innerHTML = "";

  books.forEach((book, index) => {

    const div = document.createElement("div");
    div.className = "book";

    const remaining =
      book.pages - book.completed.length;

    const percent =
      Math.round((book.completed.length / book.pages) * 100);

    let completedHTML = "";

    if (book.completed.length) {

      completedHTML =
        '<div class="completed-pages">' +
        book.completed.map(page =>
          '<span class="page-chip">' +
          page +
          ' <span class="restore" ' +
          'onclick="restorePage(' +
          index + ',' + page +
          ')" title="Restore page">×</span></span>'
        ).join("") +
        '</div>';

    } else {

      completedHTML =
        '<div class="small-note">No completed pages yet.</div>';
    }

    div.innerHTML =
      '<div class="book-title">' +
      book.name +
      '</div>' +

      '<div class="stats">' +
      book.completed.length +
      ' completed • ' +
      remaining +
      ' remaining • ' +
      book.pages +
      ' total' +
      '</div>' +

      '<div class="progress">' +
      '<div class="progress-bar" style="width:' +
      percent +
      '%"></div>' +
      '</div>' +

      completedHTML;

    container.appendChild(div);
  });
}

function resetEverything() {

  const answer = confirm(
    "This will erase ALL completed pages and any books you added. Are you sure?"
  );

  if (!answer) return;

  const secondAnswer = confirm(
    "Really reset everything? This cannot be undone."
  );

  if (!secondAnswer) return;

  localStorage.removeItem("coloringRandomizerBooks");

  books =
    JSON.parse(JSON.stringify(DEFAULT_BOOKS));

  currentBook = null;
  currentPage = null;

  saveBooks();
  renderBooks();

  document.getElementById("bookResult").textContent =
    "Ready to choose!";

  document.getElementById("pageResult").textContent = "";

  document.getElementById("completeButton").style.display =
    "none";
}

renderBooks();

</script>

</body>
</html>
